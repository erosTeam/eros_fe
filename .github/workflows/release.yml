name: Build iOS

# 只构建 iOS / iPadOS（同一个通用 IPA，TARGETED_DEVICE_FAMILY = 1,2）
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Hosted runner (use Intel if ARM capacity is unavailable)"
        type: choice
        default: macos-26-intel
        options: [macos-26-intel, macos-26]
  pull_request:
    branches:
      - 'master'
  push:
    branches:
      - 'master'
    tags:
      - v*
      - '!v*apk'
      - '!v*mac'
      - '!v*win'
      - '!v*.bot'
      - '!v*.linux'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PACKAGE_NAME: Eros-FE
  # build_runner 依赖的 analyzer 暂不兼容更新的 Dart SDK，固定 Flutter 版本
  FLUTTER_VERSION: "3.41.7"
  # 使用 iOS 26 SDK 构建，系统控件（分享面板、弹窗、键盘等）获得 Liquid Glass 外观
  XCODE_VERSION: "26.6"

jobs:
  build_ios:
    name: Build iOS & iPadOS IPA
    runs-on: ${{ inputs.runner || 'macos-26-intel' }}
    timeout-minutes: 90
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="/Applications/Xcode_${XCODE_VERSION}.app"
          if [[ ! -d "$XCODE_APP" ]]; then
            # 回退到 runner 上最新的 Xcode 26
            XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [[ -z "$XCODE_APP" || ! -d "$XCODE_APP" ]]; then
            echo "::error::Xcode 26 is not available on this runner image."
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Get app version
        id: version
        shell: bash
        run: |
          app_version=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          echo "app_version=${app_version}" >> "$GITHUB_ENV"
          echo "app_version=${app_version}" >> "$GITHUB_OUTPUT"
          echo "App version: ${app_version}"

      # 有 git-crypt 密钥时解密配置；fork 仓库没有密钥时使用示例配置，保证可以构建
      - name: Unlock secrets
        shell: bash
        env:
          GIT_CRYPT_KEY: ${{ secrets.ENCODED_GIT_CRYPT }}
        run: |
          set -euo pipefail
          if [[ -n "${GIT_CRYPT_KEY}" ]]; then
            brew install git-crypt
            echo "$GIT_CRYPT_KEY" | base64 -d -o "$RUNNER_TEMP/git-crypt.key"
            git-crypt unlock "$RUNNER_TEMP/git-crypt.key"
            rm -f "$RUNNER_TEMP/git-crypt.key"
            echo "Secrets unlocked."
            exit 0
          fi

          echo "::notice::ENCODED_GIT_CRYPT secret not set, building with sample configuration (no Sentry / OpenL key)."
          cp lib/config/config.dart.sample lib/config/config.dart
          # 加密后的 plist 无法通过 Xcode 的 plist 校验，替换为空配置
          cat > ios/Runner/GoogleService-Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict/>
          </plist>
          PLIST
          plutil -lint ios/Runner/GoogleService-Info.plist

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Flutter pub get & code generation
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run intl_utils:generate

      - name: Install CocoaPods dependencies
        run: |
          sed -i '' 's/dev2.cn.honjow.fehv/cn.honjow.fehv/g' 'ios/Runner.xcodeproj/project.pbxproj'
          cd ios
          pod install --repo-update || (rm -f Podfile.lock && pod install --repo-update)

      - name: Build iOS app (unsigned)
        run: flutter build ios --release --no-codesign --no-pub

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(ls -d build/ios/iphoneos/*.app | head -n 1)"
          test -d "$APP_PATH"
          /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$APP_PATH/Info.plist" || true
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          IPA_NAME="${PACKAGE_NAME}_${app_version}.ipa"
          (cd build/ipa && COPYFILE_DISABLE=1 zip -qry "../${IPA_NAME}" Payload)
          unzip -tq "build/${IPA_NAME}"
          (cd build && shasum -a 256 "${IPA_NAME}" > "${IPA_NAME}.sha256")
          echo "IPA_NAME=${IPA_NAME}" >> "$GITHUB_ENV"
          {
            echo "### Unsigned IPA (iPhone & iPad)"
            echo "Download **${IPA_NAME}** from this run's artifacts and sign it before installing."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: |
            build/${{ env.IPA_NAME }}
            build/${{ env.IPA_NAME }}.sha256
          if-no-files-found: error

  publish_release:
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, 'beta') && !contains(github.ref, 'alpha') && !contains(github.ref, 'rc')
    name: Publish release
    needs: build_ios
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: release-ios
          path: /tmp/artifacts

      - run: ls -R /tmp/artifacts

      - name: Resolve release notes
        id: notes
        shell: bash
        run: |
          notes="changelog/v${{ needs.build_ios.outputs.app_version }}.md"
          if [[ ! -f "$notes" ]]; then
            notes="$RUNNER_TEMP/release-notes.md"
            echo "Eros-FE ${{ github.ref_name }} (iOS / iPadOS)" > "$notes"
          fi
          echo "file=$notes" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "/tmp/artifacts/*.ipa,/tmp/artifacts/*.sha256"
          tag: ${{ github.ref_name }}
          bodyFile: ${{ steps.notes.outputs.file }}
          prerelease: ${{ contains(github.ref, 'pre') }}
          allowUpdates: true
          artifactErrorsFailBuild: true
          replacesArtifacts: true
